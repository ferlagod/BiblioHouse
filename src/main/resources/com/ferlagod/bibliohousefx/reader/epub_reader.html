<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiblioHouse EPUB Reader</title>
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: sans-serif;
      overflow: hidden; /* Let epubjs handle scrolling/pagination */
    }
    #viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="errorLog" style="color: red; font-weight: bold; padding: 20px; z-index: 9999; position: absolute; top: 0; left: 0;"></div>

  <script>
    var book = null;
    var rendition = null;

    function logToHtml(msg) {
        // textContent (no innerHTML): los mensajes pueden contener texto del EPUB
        var linea = document.createElement('div');
        linea.textContent = String(msg);
        document.getElementById('errorLog').appendChild(linea);
        if (window.javaBridge) window.javaBridge.logError(String(msg));
    }

    function configurarLibro(bookInstance, startPercentage, cachedLocations) {
        book = bookInstance;
        logToHtml("Instancia creada. Renderizando...");
        rendition = book.renderTo("viewer", {
          width: "100%",
          height: "100%",
          spread: "none"
        });

        book.ready.then(function() {
          if (cachedLocations) {
            try {
              book.locations.load(cachedLocations);
              logToHtml("Localizaciones cargadas desde caché.");
              return book.locations;
            } catch (e) {
              logToHtml("Caché de localizaciones no válida, regenerando...");
            }
          }
          logToHtml("Libro listo. Generando localizaciones...");
          return book.locations.generate(1600).then(function(locs) {
            if (window.javaBridge) window.javaBridge.guardarLocalizaciones(book.locations.save());
            return locs;
          });
        }).then(function(locations) {
          logToHtml("Localizaciones generadas. Mostrando página...");
          if (startPercentage && startPercentage > 0) {
            var cfi = book.locations.cfiFromPercentage(startPercentage / 100);
            rendition.display(cfi);
          } else {
            rendition.display();
          }
          // Limpiar log si todo ha ido bien
          document.getElementById('errorLog').textContent = "";
        }).catch(function(err) {
            logToHtml("Error en ready/locations: " + err);
        });

        rendition.on("relocated", function(location) {
          var percent = book.locations.percentageFromCfi(location.start.cfi);
          var percentageValue = Math.round(percent * 100);
          
          if (window.javaBridge) {
            window.javaBridge.updateProgress(percentageValue);
          }
        });
    }

    function openEpubUrl(epubUrl, startPercentage, cachedLocations) {
      try {
        logToHtml("Iniciando carga de EPUB desde URL: " + epubUrl);
        var bookInstance = ePub(epubUrl);
        configurarLibro(bookInstance, startPercentage, cachedLocations);
      } catch (err) {
        logToHtml("Error abriendo EPUB desde URL (Excepción): " + err);
      }
    }

    function openEpubBase64(base64Data, startPercentage, cachedLocations) {
      try {
        logToHtml("Iniciando carga de EPUB...");
        var binaryString = window.atob(base64Data);
        var bytes = new Uint8Array(binaryString.length);
        for (var i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        var arrayBuffer = bytes.buffer;
        
        logToHtml("ArrayBuffer creado. Instanciando ePub...");
        var bookInstance = ePub(arrayBuffer);
        configurarLibro(bookInstance, startPercentage, cachedLocations);
      } catch (err) {
        logToHtml("Error abriendo EPUB (Excepción): " + err);
      }
    }

    function nextPage() {
      if (rendition) rendition.next();
    }

    function prevPage() {
      if (rendition) rendition.prev();
    }
    
    function setFontSize(sizeStr) {
      if (rendition) {
        rendition.themes.fontSize(sizeStr);
      }
    }
  </script>
</body>
</html>
